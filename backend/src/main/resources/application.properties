server.port=8080

# Injected at runtime from the Kubernetes Secret "easycrud-db" (never commit real values).
# The app fails fast at startup if any of these are missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# "update" lets Hibernate create/alter the table. For a real production schema move to Flyway/Liquibase and use "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Health endpoints used by the Kubernetes probes and the ALB health check
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Comma-separated allowed browser origins. Empty = CORS disabled (correct when UI and API share one host behind the ALB).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
